<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Ambient Glow Behind Document -->
    <radialGradient id="ambientGlow" cx="55%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Document Paper Gradient (Fades out as it dissolves) -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#F1F5F9" />
      <stop offset="78%" stop-color="#CBD5E1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0" />
    </linearGradient>

    <!-- Clean Outline Accent Gradient (Cyan to Electric Blue) -->
    <linearGradient id="cleanBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Scripture Badge Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. macOS Squircle Base (824x824 centered with 100px padding) -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#ambientGlow)" />
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />

  <!-- 2. Top-Left Raw Text File (Dissolving diagonally toward bottom-right) -->
  <g id="DissolvingDocument" filter="url(#dropShadow)">
    <!-- Document Sheet Body with folded top-right corner -->
    <path d="M 220 190
             H 540
             L 640 290
             V 520
             C 640 580, 560 630, 470 660
             C 370 695, 290 730, 220 730
             Z" fill="url(#paperGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 540 190 V 266 C 540 279, 551 290, 564 290 H 640 Z" fill="#CBD5E1" opacity="0.85" />

    <!-- Raw / Cluttered Sermon Text (Top Half: bullets, jagged lines, colons) -->
    <!-- Cluttered Bullet 1 -->
    <circle cx="272" cy="276" r="10" fill="#64748B" />
    <rect x="300" y="266" width="190" height="20" rx="10" fill="#475569" />

    <!-- Cluttered Bullet 2 -->
    <circle cx="272" cy="326" r="10" fill="#64748B" />
    <rect x="300" y="316" width="265" height="20" rx="10" fill="#64748B" />
    <rect x="272" y="352" width="220" height="18" rx="9" fill="#94A3B8" />

    <!-- Cluttered Bullet 3 (Starting to fragment/dissolve) -->
    <circle cx="272" cy="404" r="10" fill="#94A3B8" opacity="0.8" />
    <rect x="300" y="394" width="140" height="18" rx="9" fill="#94A3B8" opacity="0.85" />
    <rect x="456" y="394" width="68" height="18" rx="9" fill="#94A3B8" opacity="0.6" />
    <rect x="540" y="394" width="36" height="18" rx="9" fill="#38BDF8" opacity="0.5" />

    <!-- Dissolving Fragments & Particles (Mid-Transition Zone) -->
    <rect x="272" y="446" width="90" height="16" rx="8" fill="#94A3B8" opacity="0.55" />
    <rect x="380" y="446" width="52" height="16" rx="8" fill="#38BDF8" opacity="0.65" />
    <rect x="452" y="444" width="28" height="16" rx="8" fill="#38BDF8" opacity="0.8" />
    <circle cx="506" cy="452" r="8" fill="#38BDF8" opacity="0.75" />
    <circle cx="542" cy="442" r="6" fill="#FDE047" opacity="0.9" />

    <!-- Floating Dissolve Pixels / Sparkles -->
    <rect x="310" y="492" width="42" height="14" rx="7" fill="#38BDF8" opacity="0.45" />
    <rect x="374" y="488" width="24" height="14" rx="7" fill="#60A5FA" opacity="0.7" />
    <circle cx="426" cy="496" r="7" fill="#38BDF8" opacity="0.85" />
    <circle cx="605" cy="472" r="9" fill="#38BDF8" opacity="0.65" />
    <circle cx="655" cy="445" r="6" fill="#818CF8" opacity="0.5" />
    <circle cx="578" cy="512" r="5" fill="#FDE047" opacity="0.85" />
  </g>

  <!-- 3. Diagonal Dissolve / Transformation Wave -->
  <path d="M 210 610 Q 460 535, 790 360" fill="none" stroke="url(#cleanBarGrad)" stroke-width="6" stroke-dasharray="1 18" stroke-linecap="round" opacity="0.75" />

  <!-- 4. Bottom-Right Crisp, Structured Sermon Outline (The Result) -->
  <g id="CleanOutlineCard" filter="url(#dropShadow)">
    <!-- Frosted Dark Glass Card for the Clean Outline -->
    <rect x="310" y="510" width="520" height="330" rx="36" ry="36" fill="#0F172A" fill-opacity="0.88" stroke="url(#cleanBarGrad)" stroke-width="4" />

    <!-- Outline Header Bar (Gold Scripture Reference Pill + Clean Title Bar) -->
    <rect x="354" y="556" width="118" height="34" rx="17" fill="url(#goldGrad)" filter="url(#glowEffect)" />
    <rect x="492" y="559" width="286" height="28" rx="14" fill="#FFFFFF" />

    <!-- Clean Hierarchy Level 1 -->
    <rect x="354" y="624" width="32" height="32" rx="10" fill="url(#cleanBarGrad)" />
    <rect x="406" y="628" width="340" height="24" rx="12" fill="#E2E8F0" />

    <!-- Clean Indented Sub-Point A -->
    <rect x="406" y="676" width="24" height="12" rx="6" fill="#38BDF8" />
    <rect x="446" y="672" width="260" height="20" rx="10" fill="#94A3B8" />

    <!-- Clean Hierarchy Level 2 -->
    <rect x="354" y="720" width="32" height="32" rx="10" fill="url(#cleanBarGrad)" />
    <rect x="406" y="724" width="372" height="24" rx="12" fill="#E2E8F0" />

    <!-- Clean Indented Sub-Point B -->
    <rect x="406" y="772" width="24" height="12" rx="6" fill="#38BDF8" />
    <rect x="446" y="768" width="220" height="20" rx="10" fill="#94A3B8" />
  </g>
</svg>